<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BidNest - Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="page">

        <!-- LOGIN CARD -->
        <div class="login-card">

            <h1>Login</h1>

            <p class="subtitle">
                Welcome back! Please login to your account.
            </p>


            <!-- USER / ADMIN -->
            <div class="role-switch">

                <button class="role-btn active" type="button">
                    User
                </button>

                <button class="role-btn" type="button">
                    Admin
                </button>

            </div>


            <!-- LOGIN FORM -->
            <form id="loginForm">

                <!-- EMAIL -->
                <label class="field">

                    <span class="icon">✉</span>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email address"
                        required
                    >

                </label>


                <!-- PASSWORD -->
                <label class="field">

                    <span class="icon">♙</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        id="togglePassword"
                    >
                        ◉
                    </button>

                </label>


                <!-- OPTIONS -->
                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            checked
                        >

                        <span>Remember me</span>

                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="submit"
                >
                    Login
                    <span>→</span>
                </button>

            </form>


            <!-- DIVIDER -->
            <div class="or">

                <span></span>

                <p>OR</p>

                <span></span>

            </div>


            <!-- SOCIAL LOGIN -->
            <div class="socials">

                <button
                    type="button"
                    aria-label="Google Login"
                >
                    G
                </button>

                <button
                    type="button"
                    aria-label="Apple Login"
                >
                    ●
                </button>

                <button
                    type="button"
                    aria-label="Facebook Login"
                >
                    f
                </button>

            </div>


            <!-- REGISTER -->
            <div class="signup">

                <span>
                    Don't have an account?
                </span>

                <a href="#">
                    Register here
                </a>

            </div>

        </div>

    </div>


    <script src="login.js"></script>

</body>
</html>
